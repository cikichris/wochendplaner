<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wochenendplaner</title>
  <meta name="description" content="Unsere Wochenenden gemeinsam planen.">
  <meta name="theme-color" content="#fbf7f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16141a" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wochenende">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Farbschema vor dem ersten Zeichnen setzen (verhindert Aufblitzen)
    try {
      var t = localStorage.getItem('wochenendplaner.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand">
      <img src="icon.svg" alt="" width="28" height="28">
      <span>Wochenendplaner</span>
    </h1>
    <div class="topbar-actions">
      <span id="live" class="live" role="status" aria-live="polite" title="Verbindung wird aufgebaut …"><i></i><span class="sr-only">Verbinde …</span></span>
      <button id="userBtn" class="chip" type="button" aria-label="Name ändern">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <span id="userName">…</span>
      </button>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Farbschema: automatisch"></button>
    </div>
  </header>

  <div id="banner" class="banner" role="alert" hidden></div>

  <main id="main">
    <section id="view-weekends" class="view" aria-label="Wochenenden">
      <p class="loading">Lade Wochenenden …</p>
    </section>
    <section id="view-ideas" class="view" aria-label="Ideensammlung &amp; Vorschläge" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Bereiche">
    <button class="tab" type="button" data-view="weekends" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Wochenenden</span>
    </button>
    <button class="tab" type="button" data-view="ideas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
      <span>Ideen <b id="ideaCount" class="count" hidden></b></span>
    </button>
  </nav>

  <!-- Wer bist du? -->
  <dialog id="nameDialog" class="sheet" aria-labelledby="nameTitle">
    <form id="nameForm" method="dialog">
      <h2 id="nameTitle">Hallo! Wer bist du?</h2>
      <p class="muted">Dein Name erscheint bei allem, was du einträgst („eingetragen von“). Er wird nur in diesem Browser gespeichert.</p>
      <div id="nameSuggestions" class="name-suggestions"></div>
      <label class="field">
        <span>Oder anderer Name</span>
        <input id="nameInput" name="name" type="text" autocomplete="given-name" maxlength="40" placeholder="Dein Name">
      </label>
      <div class="actions">
        <button id="nameCancel" class="btn ghost" type="button" hidden>Abbrechen</button>
        <button class="btn primary" type="submit">Weiter</button>
      </div>
    </form>
  </dialog>

  <!-- Aktivität / Idee bearbeiten -->
  <dialog id="editDialog" class="sheet" aria-labelledby="editTitle">
    <form id="editForm" method="dialog" novalidate>
      <h2 id="editTitle">Aktivität</h2>
      <p id="editContext" class="context"></p>
      <label class="field">
        <span>Titel</span>
        <input name="title" type="text" required maxlength="120" placeholder="z. B. Brunch im Café" autocomplete="off">
      </label>
      <div class="field-row">
        <label class="field">
          <span>Uhrzeit <small>(optional)</small></span>
          <input name="start_time" type="time">
        </label>
        <label class="field grow">
          <span>Ort <small>(optional)</small></span>
          <input name="location" type="text" maxlength="120" placeholder="z. B. Altstadt" autocomplete="off">
        </label>
      </div>
      <label class="field">
        <span>Notiz <small>(optional)</small></span>
        <textarea name="note" rows="3" maxlength="1000" placeholder="Was sollten wir wissen?"></textarea>
      </label>
      <p id="editMeta" class="meta"></p>
      <div class="actions">
        <button class="btn ghost" type="button" data-close>Abbrechen</button>
        <button class="btn primary" type="submit">Speichern</button>
      </div>
      <div id="editExtra" class="extra-actions">
        <button id="editMove" class="btn soft" type="button"></button>
        <button id="editToIdeas" class="btn soft" type="button">In die Ideensammlung</button>
        <button id="editDelete" class="btn danger" type="button">Löschen</button>
      </div>
    </form>
  </dialog>

  <!-- Tag auswählen -->
  <dialog id="planDialog" class="sheet tall" aria-labelledby="planTitle">
    <div class="sheet-head">
      <h2 id="planTitle">Einplanen</h2>
      <button class="icon-btn" type="button" data-close aria-label="Schließen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p class="muted">Tippe auf den Tag, an dem ihr das machen wollt.</p>
    <div id="planList" class="plan-list"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
